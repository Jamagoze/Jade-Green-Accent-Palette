name: Build Emerald Monet

on:
  workflow_dispatch:
  push:
    paths:
      - 'EmeraldMonet.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract uploaded project ZIP
        run: |
          set -e
          ZIP_FILE="EmeraldMonet.zip"
          test -f "$ZIP_FILE" || {
            echo "::error::Upload EmeraldMonet.zip to the repository root."
            exit 1
          }
          mkdir -p build-source
          unzip -q "$ZIP_FILE" -d build-source
          PROJECT_DIR="$(find build-source -name settings.gradle -type f -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR" || {
            echo "::error::settings.gradle was not found in the ZIP."
            exit 1
          }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Emerald-Monet-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
